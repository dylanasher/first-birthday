# Builds the invitation and publishes it to GitHub Pages on every push to main.
# Site: https://dylanasher.github.io/first-birthday/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Google Sheet RSVP/wishes backend: set it under Settings → Secrets and variables → Actions → Variables
          VITE_RSVP_ENDPOINT: ${{ vars.VITE_RSVP_ENDPOINT }}
      # GitHub Pages has no server-side routing: serve the app for any chapter link (e.g. /rsvp)
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
